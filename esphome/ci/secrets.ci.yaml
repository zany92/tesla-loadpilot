# =============================================================================
# Tesla LoadPilot - CI-ONLY dummy secrets. NOTHING HERE IS REAL.
#
# The repo .gitignore ignores every `secrets.yaml`, so this file is committed
# under a different name and copied into place before validation:
#
#   cp esphome/ci/secrets.ci.yaml esphome/ci/secrets.yaml
#
# (the CI workflow does exactly that; do the same to validate locally).
# Never put real credentials in this file or in esphome/ci/secrets.yaml.
#
# Inventory = every `!secret` referenced by the packages pulled in by the
# four CI harness configs (twc-core, boards/kc868-a6, providers/teleinfo-fr,
# providers/teleinfo-fr-mono):
#   loadpilot_api_key       - API encryption key, MUST be base64 of 32 bytes
#   loadpilot_ota_password  - OTA password, free-form string
#   loadpilot_udp_key       - packet_transport XXTEA key; ESPHome derives the
#                             16-byte XXTEA key by SHA-256 of this string, so
#                             any string validates; a 16-char one is used for
#                             realism
#   loadpilot_wifi_ssid     - SSID, 1..32 chars
#   loadpilot_wifi_password - WPA2 passphrase, 8..64 chars
#   loadpilot_ap_password   - fallback AP passphrase, 8..64 chars
# =============================================================================
loadpilot_api_key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
loadpilot_ota_password: "ci-dummy-ota-password"
loadpilot_udp_key: "ci-dummy-xxtea-k"
loadpilot_wifi_ssid: "ci-dummy-ssid"
loadpilot_wifi_password: "ci-dummy-wifi-pass"
loadpilot_ap_password: "ci-dummy-ap-pass"
