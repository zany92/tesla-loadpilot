  # Active source of the last recompute: 0=boot, 1=UDP, 2=HA, 3=failsafe,
  # 4=control OFF. Feeds the "Source Active" text sensor.
  - id: meter_source
    type: int
    restore_value: no
    initial_value: "0"

interval:
  # Safety-net recompute (also re-evaluates the mirror debounce AND the UDP
  # freshness window expiry).
  - interval: ${recompute_interval}
    then:
      - script.execute: recompute_ct
  # Bias ramp tick: bounded steps so the wallbox pilot moves in small stairs
  # the vehicle can follow without ever overshooting (anti-trip).
  - interval: 5s
    then:
      - script.execute:
          id: twc_bias_step
          allow_ramp_step: true

script:
  # ===========================================================================
  # Bias application. RULE: the ramp only exists to protect a vehicle THAT IS
  # CHARGING (pilot violation -> contactor trip). Wallbox contactor OPEN
  # (reliable mirror) -> target applied IMMEDIATELY both ways: removes the
  # "code 10" window (160 s of down-ramp refusing to start, measured).
  # Mirror never seen / unavailable > grace / HA API down -> keep the ramp.
  # allow_ramp_step: true only from the 5 s tick — other callers (target
  # change, mirror flip) NEVER step the ramp out of cadence.
  # ===========================================================================
  - id: twc_bias_step
    parameters:
      allow_ramp_step: bool
    then:
      - lambda: |-
          float target = id(twc_bias_target).state;
          if (std::isnan(target)) target = 0.0f;
          float cur = id(twc_bias_applied);
          // -- Contactor-mirror trustworthiness (grace window) --
          uint32_t now_ms = millis();
          bool mirror_ok = id(twc_contactor_seen) && id(twc_contactor_available)
              && id(ha_link_ok).state;
          if (mirror_ok) {
            id(twc_contactor_unavail_since_ms) = 0;
          } else if (id(twc_contactor_unavail_since_ms) == 0) {
            id(twc_contactor_unavail_since_ms) = now_ms;
          }
          bool trust_mirror = id(twc_contactor_seen) &&
              (id(twc_contactor_unavail_since_ms) == 0 ||
               (now_ms - id(twc_contactor_unavail_since_ms))
                   <= (uint32_t)${contactor_mirror_grace_ms});
          bool contactor_open = trust_mirror && !id(twc_contactor_closed);
          // -- Application --
          float next = cur;
          if (contactor_open) {
            next = target;  // nobody charging: immediate, both directions
          } else if (!allow_ramp_step) {
            return;         // outside the 5 s tick: no ramp step
          } else if (target > cur) {
            next = std::min(target, cur + ${bias_ramp_up_a}f);
          } else if (target < cur) {
            next = std::max(target, cur - ${bias_ramp_down_a}f);
          }
          if (next != cur) {
            if (contactor_open && std::fabs(next - cur) > 1.0f) {
              ESP_LOGI("twc_bias", "Contactor open: bias %.1f -> %.1f A (immediate)", cur, next);
            }
            id(twc_bias_applied) = next;
            id(twc_bias_applied_sensor).publish_state(next);
            id(recompute_ct).execute();
          }

  # ===========================================================================
  # Central recompute. Source priority: UDP fresh > HA mirror > fail-safe.
  # The fail-safe is NEVER weakened: it arms as soon as neither source is
  # healthy. RAW Neurio semantics preserved verbatim.
  # ===========================================================================
  - id: recompute_ct
    then:
      - lambda: |-
          const float main_breaker = ${main_breaker_limit_a};
          const float voltage = 230.0f;
          const bool three_phase = (${phase_count} == 3);
          // ----- Source 1: direct UDP (freshness judged here, not by API) ---
          bool udp_seen_all = id(udp_current_a_seen) && id(udp_current_b_seen) &&
              id(udp_current_c_seen) && id(udp_power_a_seen) &&
              id(udp_power_b_seen) && id(udp_power_c_seen);
          bool udp_fresh = udp_seen_all && (id(udp_last_ok_ms) != 0) &&
              ((millis() - id(udp_last_ok_ms)) < (uint32_t)${udp_fresh_ms});
          // ----- Source 2: HA mirror (availability flags, debounced) --------
          // Single-phase installs only need the L1 mirror entities.
          bool all_available = id(ha_current_a_available) && id(ha_power_a_available) &&
              (!three_phase || (id(ha_current_b_available) && id(ha_current_c_available) &&
                                id(ha_power_b_available) && id(ha_power_c_available)));
          if (!all_available) {
            if (id(mirror_unavailable_since_ms) == 0) id(mirror_unavailable_since_ms) = millis();
          } else {
            id(mirror_unavailable_since_ms) = 0;
          }
          bool mirror_stale = (id(mirror_unavailable_since_ms) != 0) &&
              (millis() - id(mirror_unavailable_since_ms) >= (uint32_t)${ha_mirror_debounce_ms});
          bool ha_ok = !mirror_stale && id(ha_link_ok).state;
          // ----- Measure selection (UDP fresh > HA mirror > nothing) --------
          float m_a = 0.0f, m_b = 0.0f, m_c = 0.0f;
          float m_pa = 0.0f, m_pb = 0.0f, m_pc = 0.0f;
          bool have_measure = false;
          int source = 3;  // failsafe by default
          if (udp_fresh) {
            m_a = id(udp_a_current); m_b = id(udp_b_current); m_c = id(udp_c_current);
            m_pa = id(udp_a_power);  m_pb = id(udp_b_power);  m_pc = id(udp_c_power);
            have_measure = true;
            source = 1;
          } else if (ha_ok) {
            m_a = id(mirror_a_current); m_pa = id(mirror_a_power);
            if (three_phase) {
              m_b = id(mirror_b_current); m_c = id(mirror_c_current);
              m_pb = id(mirror_b_power);  m_pc = id(mirror_c_power);
            }
            have_measure = true;
            source = 2;
          }
          if (!three_phase) { m_b = m_c = 0.0f; m_pb = m_pc = 0.0f; }
          // ===== RAW NEURIO/GENERAC SEMANTICS (UNCHANGED) =====
          // Publish the REAL mains measure like a genuine Neurio meter; the
          // 26.18 wallbox computes margin = ITS limit (Home Load Management)
          // - published measure, and checks correlation with its own output.
          float pub_a, pub_b, pub_c;      // published current (A)
          float pub_pa, pub_pb, pub_pc;   // published power (W/VA)
          if (!id(twc_control_enabled).state) {
            // Master switch OFF: house consumption = 0 -> maximum margin ->
            // wallbox charges at its own ceiling (external control disarmed).
            pub_a = pub_b = pub_c = 0.0f;
            pub_pa = pub_pb = pub_pc = 0.0f;
            source = 4;
          } else if (!have_measure) {
            // SAFETY (no healthy source: UDP stale AND HA mirror/API dead).
            // A genuinely dead meter must BLOCK: publish consumption =
            // main_breaker (full service capacity) -> margin 0.
            ESP_LOGW("meter", "No healthy measure source (UDP stale, HA mirror/API down) -> publishing main_breaker, charge blocked");
            // (MEASURED 17/08 evening) Dither the fail-safe too: a STATIC
            // published value trips the wallbox's plausibility check into
            // DISTRUST (docs/BEHAVIOR.md §Distrust), after which it ignores
            // the meter and resumes at full demand — the exact opposite of
            // what a fail-safe is for. Alive = believed = charge actually
            // blocked. Recompute runs at ${recompute_interval}, so the
            // alternation actually ticks even with no incoming measure.
            const float fs_dth = ((millis() / 1000) % 2 == 0) ? ${law_dither_a}f : -${law_dither_a}f;
            pub_a = pub_b = pub_c = main_breaker + fs_dth;
            pub_pa = pub_pb = pub_pc = (main_breaker + fs_dth) * voltage;
          } else {
            // NORMAL: real per-phase current + power, import-positive.
            // + BIAS: publishing measure + X A forces the wallbox to lower
            // the vehicle by X A (margin = limit - published). Applied in the
            // NORMAL branch only — never in fail-safe (already main_breaker),
            // never with the master switch OFF.
            float bias = id(twc_bias_applied);
            pub_a = m_a + bias;
            pub_b = m_b + bias;
            pub_c = m_c + bias;
            pub_pa = m_pa + bias * voltage;
            pub_pb = m_pb + bias * voltage;
            pub_pc = m_pc + bias * voltage;
          }
          // ===== PVi1-GRADE v2 "CO-VARIANT" BLOCK (17/08 evening) =====
          // docs/DESIGN_LOI_COVARIANTE.md variant A + DESIGN_ANTI_GLITCH.md.
          // Measured lesson: the v1 clamp froze the published value in
          // saturation -> "lying meter" -> wallbox DISTRUST state (latched,
          // everything ignored). The co-variant law NEVER has a dead value:
          // out of constraint pub = shifted reality (gain 1, zero delay);
          // in constraint pub = L + clamp(gain*excess, nudge_min, emax) —
          // the level above L IS the measured slow-down signal (micro-law:
          // L+0.1 -> ~-1 A/s; L exactly -> HOLD; below L -> recovery).
          // Permanent +/-dither. Trip: impossible -> improbable by dynamics
          // (~20 A.s worst-phase integral budget vs seconds of exposure).
          // Upstream firewall: R1 physical floor with contactor closed (an
          // incomer can never carry less than the wallbox branch); R2 drops
          // > glitch_drop_a confirmed by 2 samples (the measured 0.6 A / 2 s
          // glitch that latched distrust: dead on arrival).
          {
            const float L = ${twc_conductor_limit_a};
            const uint32_t bnow = millis();
            const float dth = ((bnow / 1000) % 2 == 0) ? ${law_dither_a}f : -${law_dither_a}f;
            float climit = id(twc_contract_limit).state;
            if (std::isnan(climit) || climit <= 0.0f) climit = ${contract_limit_default_a};
            float bpct = id(twc_buffer_pct).state;
            if (std::isnan(bpct) || bpct < 0.0f || bpct > 30.0f) bpct = ${buffer_default_pct};
            // Shared resource = grid contract reduced by the buffer: the
            // vehicle only exploits (1-b) of the margin.
            const float budget = climit * (1.0f - bpct / 100.0f);
            float kg = id(twc_law_gain).state;
            if (std::isnan(kg) || kg < 0.1f || kg > 1.0f) kg = ${law_gain_default};
            float emax = id(twc_law_emax).state;
            if (std::isnan(emax) || emax < 0.1f || emax > 1.0f) emax = ${law_emax_default};
            const float bias = id(twc_bias_applied);
            auto mode_idx = id(twc_mode_signal).active_index();
            const int midx = mode_idx.has_value() ? (int)mode_idx.value() : 2;
            const bool law_active = (midx == 2);   // ACTIF-MAX
            bool esc = false;
            if (have_measure && id(twc_control_enabled).state) {
              // ---- Anti-glitch input firewall (currents decide; powers
              // follow their phase's decision) ----
              float mi[3] = { m_a, m_b, m_c };
              float mp[3] = { m_pa, m_pb, m_pc };
              float* fli[3] = { &id(fg_last_i_a), &id(fg_last_i_b), &id(fg_last_i_c) };
              float* flp[3] = { &id(fg_last_p_a), &id(fg_last_p_b), &id(fg_last_p_c) };
              float* fpd[3] = { &id(fg_pend_a), &id(fg_pend_b), &id(fg_pend_c) };
              int* fn[3] = { &id(fg_n_a), &id(fg_n_b), &id(fg_n_c) };
              const float DROP_A = ${glitch_drop_a}f, TOL = 1.0f;
              const int N_CONFIRM = 2;
              const int n_ph = three_phase ? 3 : 1;
              for (int i = 0; i < n_ph; i++) {
                float x = mi[i];
                if (std::isnan(*fli[i])) { *fli[i] = x; *flp[i] = mp[i]; continue; }
                if (std::isnan(x)) { mi[i] = *fli[i]; mp[i] = *flp[i]; continue; }
                if (x >= *fli[i] - DROP_A) {          // rise or gentle drop
                  *fpd[i] = NAN; *fn[i] = 0;
                  *fli[i] = x; *flp[i] = mp[i];       // zero latency
                } else {                               // sudden drop
                  if (std::isnan(*fpd[i]) || std::fabs(x - *fpd[i]) > TOL) {
                    *fpd[i] = x; *fn[i] = 1;           // new candidate
                  } else {
                    (*fn[i])++;
                  }
                  if (*fn[i] >= N_CONFIRM) {           // drop confirmed
                    *fli[i] = std::min(x, *fpd[i]); *flp[i] = mp[i];
                    *fpd[i] = NAN; *fn[i] = 0;
                  }
                  mi[i] = *fli[i]; mp[i] = *flp[i];    // held -> last value
                }
              }
              // R1: physical floor with the contactor closed (fail-open:
              // no reliable mirror -> no floor).
              const bool ctc_ok = id(twc_contactor_seen) && id(twc_contactor_available);
              if (ctc_ok && id(twc_contactor_closed)) {
                for (int i = 0; i < n_ph; i++)
                  if (mi[i] < ${vehicle_floor_a}f) mi[i] = ${vehicle_floor_a}f;
              }
              // ---- Co-variant law (worst phase, symmetric) ----
              float worst = std::max(mi[0], std::max(mi[1], mi[2]));
              float o_raw = worst + bias + (L - budget);
              float e = o_raw - L;
              float o;
              if (e <= 0.0f) {                        // OUT OF CONSTRAINT
                o = o_raw;                            // shifted reality, gain 1
                id(capped_since_ms) = 0;
              } else {                                 // IN CONSTRAINT
                float exc = kg * e;
                if (exc < ${law_nudge_min_a}f) exc = ${law_nudge_min_a}f;
                if (exc > emax) exc = emax;
                o = L + exc;
                if (id(capped_since_ms) == 0) id(capped_since_ms) = bnow;
                // Escalation timer kept as a floor/safety net only: the
                // slow-down signal is already active from the first second
                // of constraint (pub >= L + nudge_min by construction).
                if (bnow - id(capped_since_ms) >= (uint32_t)${escalation_timeout_ms}) {
                  o = std::max(o, L + ${law_nudge_min_a}f);
                  esc = true;
                }
              }
              if (id(twc_charge_stop).state) o = std::max(o, L + ${law_nudge_min_a}f);
              o += dth;                                // never a dead value
              if (o < 0.0f) o = 0.0f;
              id(shadow_pub_a) = o;
              if (law_active) {
                pub_a = pub_b = pub_c = o;
                pub_pa = pub_pb = pub_pc = o * voltage;
              }
            } else {
              id(capped_since_ms) = 0;
              id(shadow_pub_a) = pub_a;
            }
            // Contract §3.1: "Escalation Active" means the L+0.1 floor IS
            // being PUBLISHED. In RAW/OMBRE-MAX the law only runs as a
            // shadow — the timer may fire internally but nothing is acting
            // on the wallbox, so the flag stays OFF (the shadow effect
            // remains visible on "Shadow Published Current").
            id(escalation_state) = esc && law_active;
          }
          id(meter_source) = source;
          id(ct1_current_a) = pub_a;
          id(ct2_current_a) = pub_b;
          id(ct3_current_a) = pub_c;
          id(ct4_current_a) = 0.0f;
          id(ct_total_a) = pub_a + pub_b + pub_c;
          id(ct1_power_w) = pub_pa;
          id(ct2_power_w) = pub_pb;
          id(ct3_power_w) = pub_pc;
          id(ct4_power_w) = 0.0f;
          id(ct_total_w) = pub_pa + pub_pb + pub_pc;

# =============================================================================
# RS485 -> Modbus RTU SERVER (the TWC3 is the master and polls ~190-200 ms).
# Emulates a Neurio/Generac meter — identity block 1-55 and register map from
# the public gist by LucaTNT:
# https://gist.github.com/LucaTNT/4adf01a7252386559070023612efa117
# Registers INTACT — do not touch. Every read_lambda returns a pre-computed
# global (never compute in the lambda: the reply must leave in < 66 ms).
# The board package MUST provide `uart: id: rs485` (115200 8N1).
# =============================================================================
modbus:
  - id: wallconn_modbus
    uart_id: rs485
    role: server

modbus_server:
  - modbus_id: wallconn_modbus
    # id required by the "Meter Absent (test)" switch (set_address at runtime).
    id: twc_meter_server
    address: 1
    registers:
      - { address: 1, value_type: U_WORD, read_lambda: "return 0x3078;" }
      - { address: 2, value_type: U_WORD, read_lambda: "return 0x3030;" }
      - { address: 3, value_type: U_WORD, read_lambda: "return 0x3030;" }
      - { address: 4, value_type: U_WORD, read_lambda: "return 0x3034;" }
      - { address: 5, value_type: U_WORD, read_lambda: "return 0x3731;" }
      - { address: 6, value_type: U_WORD, read_lambda: "return 0x3442;" }
      - { address: 7, value_type: U_WORD, read_lambda: "return 0x3035;" }
      - { address: 8, value_type: U_WORD, read_lambda: "return 0x3638;" }
      - { address: 9, value_type: U_WORD, read_lambda: "return 0x3631;" }
      - { address: 10, value_type: U_WORD, read_lambda: "return 0x0000;" }
      - { address: 11, value_type: U_WORD, read_lambda: "return 0x312E;" }
      - { address: 12, value_type: U_WORD, read_lambda: "return 0x362E;" }
      - { address: 13, value_type: U_WORD, read_lambda: "return 0x312D;" }
      - { address: 14, value_type: U_WORD, read_lambda: "return 0x5465;" }
      - { address: 15, value_type: U_WORD, read_lambda: "return 0x736C;" }
      - { address: 16, value_type: U_WORD, read_lambda: "return 0x6100;" }
      - { address: 17, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 18, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 19, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 20, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 21, value_type: U_WORD, read_lambda: "return 0x3031;" }
      - { address: 22, value_type: U_WORD, read_lambda: "return 0x322E;" }
      - { address: 23, value_type: U_WORD, read_lambda: "return 0x3030;" }
      - { address: 24, value_type: U_WORD, read_lambda: "return 0x3032;" }
      - { address: 25, value_type: U_WORD, read_lambda: "return 0x3041;" }
      - { address: 26, value_type: U_WORD, read_lambda: "return 0x2E48;" }
      - { address: 27, value_type: U_WORD, read_lambda: "return 0x0000;" }
      - { address: 28, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 29, value_type: U_WORD, read_lambda: "return 0x3930;" }
      - { address: 30, value_type: U_WORD, read_lambda: "return 0x3935;" }
      - { address: 31, value_type: U_WORD, read_lambda: "return 0x3400;" }
      - { address: 32, value_type: U_WORD, read_lambda: "return 0x5641;" }
      - { address: 33, value_type: U_WORD, read_lambda: "return 0x4834;" }
      - { address: 34, value_type: U_WORD, read_lambda: "return 0x3831;" }
      - { address: 35, value_type: U_WORD, read_lambda: "return 0x3041;" }
      - { address: 36, value_type: U_WORD, read_lambda: "return 0x4230;" }
      - { address: 37, value_type: U_WORD, read_lambda: "return 0x3233;" }
      - { address: 38, value_type: U_WORD, read_lambda: "return 0x3100;" }
      - { address: 39, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 40, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 41, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 42, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 43, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 44, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 45, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 46, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 47, value_type: U_WORD, read_lambda: "return 0x3034;" }
      - { address: 48, value_type: U_WORD, read_lambda: "return 0x3A37;" }
      - { address: 49, value_type: U_WORD, read_lambda: "return 0x313A;" }
      - { address: 50, value_type: U_WORD, read_lambda: "return 0x3442;" }
      - { address: 51, value_type: U_WORD, read_lambda: "return 0x3A30;" }
      - { address: 52, value_type: U_WORD, read_lambda: "return 0x353A;" }
      - { address: 53, value_type: U_WORD, read_lambda: "return 0x3638;" }
      - { address: 54, value_type: U_WORD, read_lambda: "return 0x3A36;" }
      - { address: 55, value_type: U_WORD, read_lambda: "return 0x3100;" }
      # Power (W)
      - { address: 0x88, value_type: FP32, read_lambda: "return id(ct1_power_w);" }
      - { address: 0x8A, value_type: FP32, read_lambda: "return id(ct2_power_w);" }
      - { address: 0x8C, value_type: FP32, read_lambda: "return id(ct3_power_w);" }
      - { address: 0x8E, value_type: FP32, read_lambda: "return id(ct4_power_w);" }
      - { address: 0x90, value_type: FP32, read_lambda: "return id(ct_total_w);" }
      - { address: 0x92, value_type: U_WORD, read_lambda: "return 0;" }
      # Current (A) — 0xF4 = first register polled by the TWC3, cycle marker
      - address: 0xF4
        value_type: FP32
        read_lambda: |-
          uint32_t now = millis();
          if (id(last_poll_ms) != 0) {
            id(poll_interval_ms) = (float)(now - id(last_poll_ms));
          }
          id(last_poll_ms) = now;
          return id(ct1_current_a);
      - { address: 0xF6, value_type: FP32, read_lambda: "return id(ct2_current_a);" }
      - { address: 0xF8, value_type: FP32, read_lambda: "return id(ct3_current_a);" }
      - { address: 0xFA, value_type: FP32, read_lambda: "return id(ct4_current_a);" }
      - { address: 0xFC, value_type: FP32, read_lambda: "return id(ct_total_a);" }
      # "Generac" initialisation handshake
      - { address: 40002, value_type: U_WORD, read_lambda: "return 0x0001;" }
      - { address: 40003, value_type: U_WORD, read_lambda: "return 0x0042;" }
      - { address: 40004, value_type: U_WORD, read_lambda: "return 0x4765;" }
      - { address: 40005, value_type: U_WORD, read_lambda: "return 0x6E65;" }
      - { address: 40006, value_type: U_WORD, read_lambda: "return 0x7261;" }
      - { address: 40007, value_type: U_WORD, read_lambda: "return 0x6300;" }
