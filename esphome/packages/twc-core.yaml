# =============================================================================
# Tesla LoadPilot — twc-core.yaml (board-agnostic charger-node core)
#
# Extracted from the production-validated "PVi1-GRADE v2 CO-VARIANT
# (17/08/2026 evening, flash #2)" block. The control law is FIRMWARE: it
# needs neither Home Assistant nor any cloud (ARCHITECTURE.md D2). This
# package contains everything that regulates and protects;
# boards/<board>.yaml adds pins/network only.
#
# Law v2 "co-variant" (measured, docs/40_LOI_DE_COMMANDE.md +
# docs/DESIGN_LOI_COVARIANTE.md — do NOT "improve" it):
#   o_raw = worst_phase + bias + (L − budget),  budget = contract × (1 − b%)
#   out of constraint (o_raw ≤ L): pub = o_raw    (shifted reality, gain 1,
#     zero delay — the published value is NEVER a dead flat: ±0.05 dither)
#   in constraint  (o_raw > L):    pub = L + clamp(gain × excess, 0.1, emax)
#     — the level above L IS the measured slow-down signal (micro-law:
#     L+0.1 → ~−1 A/s; L exactly → HOLD; below L → recovery). The 120 s
#     escalation timer remains as a floor/safety net only.
#   pub is published identically on the 3 CT channels (symmetric).
#   Input firewall (docs/DESIGN_ANTI_GLITCH.md): R1 physical floor with the
#   contactor closed (an incomer can never read below the charger's own
#   branch); R2 sudden drops > 5 A confirmed by 2 samples before being
#   believed (rises always pass immediately — the safe direction).
#   fail-safe: no healthy source → publish main_breaker ± dither (margin 0,
#   charge blocked; DITHERED — a static value would trip distrust and undo
#   the fail-safe) — also the boot state. Source priority: UDP > HA mirror >
#   failsafe.
#
# Attribution: core inspiration PVi1 (github.com/PVi1/esphome-twc-control);
# Neurio/Generac register map: gist by LucaTNT.
# This project is not affiliated with, endorsed by, or sponsored by Tesla, Inc.
#
# KNOWN TRAP (measured): NEVER set `logger: level: VERBOSE` on this node.
# Blocking per-frame modbus logs delay the Modbus reply past the TWC ~66 ms
# retry deadline -> self-sustained retry storm, zero replies emitted.
# Default DEBUG is silent per frame and safe.
# =============================================================================
substitutions:
  node_name: loadpilot-twc
  friendly_name: LoadPilot TWC
  # Name of the meter-provider ESPHome node (packet_transport provider name).
  meter_node_name: loadpilot-meter
  # Package version — MUST match the release tag (skew detection in HA).
  loadpilot_fw_version: "0.1.0"

  # --- Electrical limits (THREE different limits, do not confuse) -----------
  # Max Conductor Limit as configured in the Tesla One installer menu (A).
  # The whole calibration (docs/40_LOI_DE_COMMANDE.md) was measured at 21 A.
  twc_conductor_limit_a: "21"
  # Service breaker per phase (A) — fail-safe publication value.
  main_breaker_limit_a: "25"
  # Default grid-contract limit per phase (A) — runtime-adjustable via the
  # "Contract Limit" number (node-resident, flash-restored).
  contract_limit_default_a: "21.7"
  # Default safety buffer (%) — runtime-adjustable via "Buffer Pct".
  buffer_default_pct: "10"
  # Bias lever upper bound (A).
  bias_max_a: "16"
  # 1 (single-phase: B/C measures forced to 0) or 3.
  phase_count: "3"

  # --- Co-variant law knobs (flash #2, docs/DESIGN_LOI_COVARIANTE.md) ------
  # Compression gain above L (runtime-adjustable via "Law Echo Gain";
  # restore_value false: the law must always boot at its validated default).
  law_gain_default: "0.5"
  # Max excursion above L (A) — runtime-adjustable via "Law Max Excursion".
  law_emax_default: "1.0"
  # Minimum nudge above L (A): the smallest slow-down signal, and the floor
  # applied by the escalation net and by "Charge Stop". NOT a knob.
  law_nudge_min_a: "0.1"
  # Permanent alternating dither amplitude (A, 1 Hz): the published value is
  # never twice the same — insurance against any momentarily flat source
  # (a static value is what latches the wallbox distrust state). NOT a knob.
  law_dither_a: "0.05"

  # --- Input firewall (anti-glitch, docs/DESIGN_ANTI_GLITCH.md) ------------
  # R1: with the wallbox contactor closed each incomer phase carries at
  # least the vehicle minimum (~6 A AC) — a lower reading is physically
  # impossible and would latch distrust (measured: a 0.6 A / 2 s glitch did).
  vehicle_floor_a: "6.0"
  # R2: a drop larger than this (A, sample-to-sample) must repeat on 2
  # consecutive samples before being believed. Rises pass immediately.
  glitch_drop_a: "5.0"

  # --- Loop timings (measured, see docs/40_LOI_DE_COMMANDE.md §5) -----------
  recompute_interval: 1000ms
  escalation_timeout_ms: "120000"     # sustained zero-avail before L+0.1
  udp_fresh_ms: "5000"                # 5 missed 1 Hz heartbeats -> HA mirror
  ha_mirror_debounce_ms: "10000"      # HA mirror unavailability debounce
  contactor_mirror_grace_ms: "30000"  # contactor mirror grace window
  bias_ramp_up_a: "1.0"               # per 5 s tick, vehicle charging
  bias_ramp_down_a: "0.5"             # per 5 s tick, vehicle charging

  # --- HA mirror entities (BACKUP measure path; override per install) -------
  ha_current_a_entity: sensor.loadpilot_meter_current_l1
  ha_current_b_entity: sensor.loadpilot_meter_current_l2
  ha_current_c_entity: sensor.loadpilot_meter_current_l3
  ha_power_a_entity: sensor.loadpilot_meter_power_l1
  ha_power_b_entity: sensor.loadpilot_meter_power_l2
  ha_power_c_entity: sensor.loadpilot_meter_power_l3
  # TWC contactor mirror (native tesla_wall_connector integration).
  # Contactor OPEN -> bias target applied immediately (no ramp needed when
  # nobody charges); mirror unavailable > grace -> keep the ramp (prudence).
  ha_contactor_entity: binary_sensor.tesla_wall_connector_contactor_closed

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  # Two simultaneous ESPHome builds crashed the build machine (measured).
  compile_process_limit: 1
  project:
    name: loadpilot.twc-core
    version: ${loadpilot_fw_version}

# Default level (DEBUG) only — see the VERBOSE trap in the header.
logger:

api:
  encryption:
    key: !secret loadpilot_api_key
  # The law must keep running with HA down (D2): never reboot on API loss.
  reboot_timeout: 0s
  # Watchdog: without the HA link the mirrored measures cannot be trusted
  # (the direct UDP feed is judged on its OWN freshness in recompute_ct)
  # -> immediate source re-evaluation.
  on_client_disconnected:
    - lambda: |-
        ESP_LOGW("watchdog", "API client '%s' disconnected, re-evaluating sources", client_info.c_str());
        id(ha_api_connected) = false;
    - script.execute: recompute_ct
  on_client_connected:
    - lambda: |-
        id(ha_api_connected) = true;
    - script.execute: recompute_ct

ota:
  - platform: esphome
    password: !secret loadpilot_ota_password

# =============================================================================
# UDP <- meter provider. PURE RECEIVE: providers only, no ping_pong -> ESPHome
# only creates the non-blocking listen socket (drained in loop()); this node
# emits NOTHING, so nothing can delay the Modbus reply (< 66 ms deadline).
# Port 18511 (default). Without ping_pong the native timeout (status/NAN) is
# INACTIVE: freshness is judged by udp_last_ok_ms in recompute_ct.
# =============================================================================
udp:
  id: udp_meter

packet_transport:
  - platform: udp
    udp_id: udp_meter
    providers:
      - name: ${meter_node_name}
        encryption: !secret loadpilot_udp_key

sensor:
  # ===========================================================================
  # UDP measures (internal, no HA entity, zero recorder cost).
  # publish_state fires on EVERY packet carrying the value (full 1 Hz resend
  # + immediate increments) -> on_value doubles as the freshness heartbeat.
  # The *_seen flags prevent init zeros from ever reaching the wallbox.
  # ===========================================================================
  - platform: packet_transport
    id: udp_current_a
    provider: ${meter_node_name}
    remote_id: lky_ia
    on_value:
      then:
        - lambda: |-
            if (!std::isnan(x)) {
              id(udp_a_current) = x;
              id(udp_current_a_seen) = true;
              id(udp_last_ok_ms) = millis();
            }
        - script.execute: recompute_ct
  - platform: packet_transport
    id: udp_current_b
    provider: ${meter_node_name}
    remote_id: lky_ib
    on_value:
      then:
        - lambda: |-
            if (!std::isnan(x)) {
              id(udp_b_current) = x;
              id(udp_current_b_seen) = true;
              id(udp_last_ok_ms) = millis();
            }
        - script.execute: recompute_ct
  - platform: packet_transport
    id: udp_current_c
    provider: ${meter_node_name}
    remote_id: lky_ic
    on_value:
      then:
        - lambda: |-
            if (!std::isnan(x)) {
              id(udp_c_current) = x;
              id(udp_current_c_seen) = true;
              id(udp_last_ok_ms) = millis();
            }
        - script.execute: recompute_ct
  - platform: packet_transport
    id: udp_power_a
    provider: ${meter_node_name}
    remote_id: lky_pa
    on_value:
      then:
        - lambda: |-
            if (!std::isnan(x)) {
              id(udp_a_power) = x;
              id(udp_power_a_seen) = true;
              id(udp_last_ok_ms) = millis();
            }
        - script.execute: recompute_ct
  - platform: packet_transport
    id: udp_power_b
    provider: ${meter_node_name}
    remote_id: lky_pb
    on_value:
      then:
        - lambda: |-
            if (!std::isnan(x)) {
              id(udp_b_power) = x;
              id(udp_power_b_seen) = true;
              id(udp_last_ok_ms) = millis();
            }
        - script.execute: recompute_ct
  - platform: packet_transport
    id: udp_power_c
    provider: ${meter_node_name}
    remote_id: lky_pc
    on_value:
      then:
        - lambda: |-
            if (!std::isnan(x)) {
              id(udp_c_power) = x;
              id(udp_power_c_seen) = true;
              id(udp_last_ok_ms) = millis();
            }
        - script.execute: recompute_ct

  # ===========================================================================
  # HA mirror measures (BACKUP source since 14/08; UDP wins while fresh).
  # The homeassistant sensor publishes NAN on unavailable/unknown -> drives
  # the availability flags consumed by recompute_ct.
  # ===========================================================================
  - platform: homeassistant
    id: ha_current_a
    entity_id: ${ha_current_a_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) {
              ESP_LOGW("mirror", "%s unavailable", "${ha_current_a_entity}");
              id(ha_current_a_available) = false;
            } else {
              id(mirror_a_current) = x;
              id(mirror_last_ok_ms) = millis();
              id(ha_current_a_available) = true;
            }
        - script.execute: recompute_ct
  - platform: homeassistant
    id: ha_current_b
    entity_id: ${ha_current_b_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) {
              ESP_LOGW("mirror", "%s unavailable", "${ha_current_b_entity}");
              id(ha_current_b_available) = false;
            } else {
              id(mirror_b_current) = x;
              id(mirror_last_ok_ms) = millis();
              id(ha_current_b_available) = true;
            }
        - script.execute: recompute_ct
  - platform: homeassistant
    id: ha_current_c
    entity_id: ${ha_current_c_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) {
              ESP_LOGW("mirror", "%s unavailable", "${ha_current_c_entity}");
              id(ha_current_c_available) = false;
            } else {
              id(mirror_c_current) = x;
              id(mirror_last_ok_ms) = millis();
              id(ha_current_c_available) = true;
            }
        - script.execute: recompute_ct
  - platform: homeassistant
    id: ha_power_a
    entity_id: ${ha_power_a_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) {
              ESP_LOGW("mirror", "%s unavailable", "${ha_power_a_entity}");
              id(ha_power_a_available) = false;
            } else {
              id(mirror_a_power) = x;
              id(mirror_last_ok_ms) = millis();
              id(ha_power_a_available) = true;
            }
        - script.execute: recompute_ct
  - platform: homeassistant
    id: ha_power_b
    entity_id: ${ha_power_b_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) {
              ESP_LOGW("mirror", "%s unavailable", "${ha_power_b_entity}");
              id(ha_power_b_available) = false;
            } else {
              id(mirror_b_power) = x;
              id(mirror_last_ok_ms) = millis();
              id(ha_power_b_available) = true;
            }
        - script.execute: recompute_ct
  - platform: homeassistant
    id: ha_power_c
    entity_id: ${ha_power_c_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) {
              ESP_LOGW("mirror", "%s unavailable", "${ha_power_c_entity}");
              id(ha_power_c_available) = false;
            } else {
              id(mirror_c_power) = x;
              id(mirror_last_ok_ms) = millis();
              id(ha_power_c_available) = true;
            }
        - script.execute: recompute_ct

  # ===========================================================================
  # Observability (CONTRACTUAL entity names — see /CONTRACTS.md §3.1).
  # ===========================================================================
  # Current actually PUBLISHED to the wallbox registers (symmetric by
  # construction in ACTIF-MAX).
  - platform: template
    name: "Published Current L1"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: "return id(ct1_current_a);"
  - platform: template
    name: "Published Current L2"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: "return id(ct2_current_a);"
  - platform: template
    name: "Published Current L3"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: "return id(ct3_current_a);"

  # Measure of the ACTIVE source (what actually feeds recompute_ct).
  - platform: template
    name: "Real Current L1"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 2s
    lambda: "return (id(meter_source) == 1) ? id(udp_a_current) : id(mirror_a_current);"
  - platform: template
    name: "Real Current L2"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 2s
    lambda: "return (id(meter_source) == 1) ? id(udp_b_current) : id(mirror_b_current);"
  - platform: template
    name: "Real Current L3"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 2s
    lambda: "return (id(meter_source) == 1) ? id(udp_c_current) : id(mirror_c_current);"

  - platform: template
    name: "Real Power L1"
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 2s
    lambda: "return (id(meter_source) == 1) ? id(udp_a_power) : id(mirror_a_power);"
  - platform: template
    name: "Real Power L2"
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 2s
    lambda: "return (id(meter_source) == 1) ? id(udp_b_power) : id(mirror_b_power);"
  - platform: template
    name: "Real Power L3"
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 2s
    lambda: "return (id(meter_source) == 1) ? id(udp_c_power) : id(mirror_c_power);"

  # Age of the last healthy UDP value (expected < ~1100 ms in steady state).
  - platform: template
    name: "UDP Age"
    icon: "mdi:timer-alert-outline"
    unit_of_measurement: "ms"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      if (id(udp_last_ok_ms) == 0) return NAN;
      return (float)(millis() - id(udp_last_ok_ms));

  # ~190-200 ms expected while the TWC polls (register 0xF4 timestamps cycles).
  - platform: template
    name: "Poll Interval"
    icon: "mdi:timer-sync-outline"
    unit_of_measurement: "ms"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 2s
    lambda: "return id(poll_interval_ms);"

  # Bias actually applied by the ramp (the number above is only the TARGET;
  # without this sensor a slow down-ramp is undiagnosable — "code 10" window).
  - platform: template
    id: twc_bias_applied_sensor
    name: "Bias Applied"
    icon: "mdi:car-speed-limiter"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: "return id(twc_bias_applied);"

  # NON-CONTRACTUAL diagnostic: what ACTIF-MAX would publish (useful while
  # observing in RAW / OMBRE-MAX before arming the law).
  - platform: template
    name: "Shadow Published Current"
    entity_category: diagnostic
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: 2s
    lambda: "return id(shadow_pub_a);"

binary_sensor:
  # Native multi-client API status (a hand-rolled flag stayed false after a
  # SECONDARY dashboard client disconnected — measured bug).
  - platform: status
    id: ha_link_ok
    internal: true

  - platform: template
    name: "Polling Active"
    id: twc_polling_active
    device_class: running
    lambda: |-
      if (id(last_poll_ms) == 0) return false;
      return (millis() - id(last_poll_ms)) < 2000;

  # Freshness of the direct UDP feed (same criteria as recompute_ct).
  - platform: template
    name: "UDP Fresh"
    id: udp_data_fresh
    device_class: connectivity
    lambda: |-
      bool seen_all = id(udp_current_a_seen) && id(udp_current_b_seen) &&
          id(udp_current_c_seen) && id(udp_power_a_seen) &&
          id(udp_power_b_seen) && id(udp_power_c_seen);
      if (!seen_all || id(udp_last_ok_ms) == 0) return false;
      return (millis() - id(udp_last_ok_ms)) < (uint32_t)${udp_fresh_ms};

  # 120 s escalation net engaged (constraint sustained for 120 s; under the
  # co-variant law the slow-down signal is already active from the first
  # second of constraint — this flag marks the safety net only).
  # ON only when the net is actually PUBLISHED, i.e. in ACTIF-MAX (in
  # RAW/OMBRE-MAX the law runs as a shadow and this flag stays OFF).
  - platform: template
    name: "Escalation Active"
    id: twc_escalation_active
    lambda: "return id(escalation_state);"

text_sensor:
  # Contactor mirror as a TEXT sensor on purpose: the homeassistant
  # binary_sensor platform swallows unavailable/unknown (parse_on_off without
  # callback) — as text we SEE unavailability and can apply the grace window.
  - platform: homeassistant
    id: twc_contactor_mirror
    entity_id: ${ha_contactor_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (x == "on") {
              id(twc_contactor_closed) = true;
              id(twc_contactor_seen) = true;
              id(twc_contactor_available) = true;
            } else if (x == "off") {
              id(twc_contactor_closed) = false;
              id(twc_contactor_seen) = true;
              id(twc_contactor_available) = true;
            } else {
              // unavailable / unknown / None -> grace-window timestamping is
              // handled by twc_bias_step (5 s tick).
              id(twc_contactor_available) = false;
            }
        # Contactor just opened -> apply the target immediately (no
        # out-of-cadence ramp step: allow_ramp_step false).
        - script.execute:
            id: twc_bias_step
            allow_ramp_step: false

  # Measure source actually used by recompute_ct.
  - platform: template
    name: "Source Active"
    icon: "mdi:source-branch"
    update_interval: 2s
    lambda: |-
      switch (id(meter_source)) {
        case 1: return {"UDP"};
        case 2: return {"HA"};
        case 3: return {"FAILSAFE"};
        case 4: return {"OFF"};
        default: return {"BOOT"};
      }

  # Package version, for firmware/integration skew detection (Repairs).
  - platform: template
    name: "FW Version"
    icon: "mdi:tag-outline"
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return {"${loadpilot_fw_version}"};'

switch:
  # Master kill-switch. OFF -> publish a constant 0 A: the TWC distrusts the
  # flat meter and falls back to factory behaviour (Tesla app slider) without
  # touching the RS485 wiring. Node-resident, flash-restored, default ON.
  - platform: template
    id: twc_control_enabled
    name: "Control Enabled"
    icon: "mdi:power-plug-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: recompute_ct
    on_turn_off:
      - script.execute: recompute_ct

  # Direct STOP: immediately publishes the stop order (L + nudge, dithered)
  # without waiting for the bias ramp or the 120 s escalation. Never restored
  # at boot (RESTORE_DEFAULT_OFF): a deliberate stop must never become a
  # phantom state after an OTA/reboot.
  - platform: template
    id: twc_charge_stop
    name: "Charge Stop"
    icon: "mdi:octagon"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: recompute_ct
    on_turn_off:
      - script.execute: recompute_ct

  # Meter-absent test switch: total Modbus silence (the slave address moves
  # to 245 — the wallbox gets NO reply at all = meter unplugged), to
  # exercise the documented "loss of meter → 6 A max output" fallback
  # (docs/DESIGN_METER_ABSENT.md, set_address() verified on ESPHome source).
  # Reversible at runtime. Never restored at boot.
  - platform: template
    id: twc_meter_absent
    name: "Meter Absent (test)"
    icon: "mdi:meter-electric-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: 'id(twc_meter_server)->set_address(245);'
    on_turn_off:
      - lambda: 'id(twc_meter_server)->set_address(1);'

select:
  # Signal mode (commissioning ladder):
  #   RAW       — publish the raw measure (+bias): plain Neurio emulation.
  #   OMBRE-MAX — publish RAW, compute the law as a shadow (observe first).
  #   ACTIF-MAX — publish the worst-phase symmetric co-variant law (production).
  # ALWAYS boots in ACTIF-MAX (restore_value false): a silent post-OTA
  # return to RAW was the dangerous mode (measured: 2 grid cut-offs in one
  # morning). The boot semantics stay safe whatever the mode: pub =
  # main_breaker until the first healthy measure.
  - platform: template
    name: "Signal Mode"
    id: twc_mode_signal
    options: ["RAW", "OMBRE-MAX", "ACTIF-MAX"]
    initial_option: "ACTIF-MAX"
    optimistic: true
    restore_value: false
    icon: "mdi:waveform"

number:
  # Bias TARGET (0..max, step 0.5). The RAMP stays firmware: an unramped
  # margin step during a vehicle ramp violates the pilot -> contactor trip
  # (58 wallbox alerts in one day, measured). restore_value false: 0 A
  # (no restriction) is the safe boot default.
  - platform: template
    id: twc_bias_target
    name: "Bias Target"
    icon: "mdi:car-speed-limiter"
    min_value: 0
    max_value: ${bias_max_a}
    step: 0.5
    unit_of_measurement: "A"
    restore_value: false
    initial_value: 0
    optimistic: true
    on_value:
      then:
        # New target -> if the wallbox contactor is OPEN (nobody charging),
        # apply immediately; otherwise no out-of-cadence ramp step.
        - script.execute:
            id: twc_bias_step
            allow_ramp_step: false

  # Grid-contract limit per phase (A). Node-resident and flash-restored (D2):
  # the integration WRITES it, never hosts it.
  - platform: template
    id: twc_contract_limit
    name: "Contract Limit"
    icon: "mdi:transmission-tower"
    min_value: 6
    max_value: 120
    step: 0.1
    unit_of_measurement: "A"
    restore_value: true
    initial_value: ${contract_limit_default_a}
    optimistic: true
    on_value:
      then:
        - script.execute: recompute_ct

  # Safety buffer (%): the vehicle only ever exploits (1 - b) of the
  # contract resource, in steady state as in transients.
  - platform: template
    id: twc_buffer_pct
    name: "Buffer Pct"
    icon: "mdi:shield-half-full"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 30
    step: 1
    restore_value: true
    initial_value: ${buffer_default_pct}
    optimistic: true
    on_value:
      then:
        - script.execute: recompute_ct

  # Co-variant law: compression gain above L. In constraint the published
  # value is L + clamp(gain × excess, nudge_min, emax). restore_value false
  # ON PURPOSE: after any reboot the law runs at its validated defaults —
  # a forgotten tuning experiment must never survive a power cycle.
  - platform: template
    id: twc_law_gain
    name: "Law Echo Gain"
    icon: "mdi:tune"
    min_value: 0.1
    max_value: 1.0
    step: 0.05
    restore_value: false
    initial_value: ${law_gain_default}
    optimistic: true

  # Co-variant law: maximum excursion above L (A). Bounds the worst-phase
  # protection-integral exposure (~20 A·s budget: L+1 sustained ≈ 20 s).
  - platform: template
    id: twc_law_emax
    name: "Law Max Excursion"
    icon: "mdi:arrow-expand-up"
    unit_of_measurement: "A"
    min_value: 0.1
    max_value: 1.0
    step: 0.1
    restore_value: false
    initial_value: ${law_emax_default}
    optimistic: true

globals:
  # ===== PVi1-grade: zero CONTROL state beyond capped_since_ms. =====
  # Every extra internal control state in earlier estimator designs created
  # its own bug (measured lesson) — do not add any. The fg_* block below is
  # INPUT-FILTERING state (anti-glitch firewall), not control state.
  # ---- Anti-glitch firewall state, per phase: last believed value
  # (current/power) + pending drop candidate + confirmation counter. ----
  - id: fg_last_i_a
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: fg_last_i_b
