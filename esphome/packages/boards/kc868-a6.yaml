# =============================================================================
# Tesla LoadPilot — board pack: Kincony KC868-A6 (VALIDATED REFERENCE)
#
# Production-proven charger-node board (poll ~190 ms, full chain validated
# 17/08/2026). Pins / network / transceiver ONLY — the control law lives in
# twc-core.yaml.
#
# RS485: onboard MAX13487E with hardware AUTO-DIRECTION -> no DE/RE pin to
# drive (confirmed by Kincony's official ESPHome modbus config: tx/rx only).
#   - https://devices.esphome.io/devices/kincony-kc868-a6/
#   - https://www.kincony.com/forum/showthread.php?tid=1962
#   - https://www.kincony.com/forum/showthread.php?tid=6836
#
# WIRING to the TWC3 "RS485 A / B" internal terminal (near 230 V — WALLBOX
# BREAKER OFF before opening the cover):
#   - terminal A (KC868-A6) -> RED wire of the TWC internal RS485 block (A+)
#   - terminal B (KC868-A6) -> WHITE wire (B-)
#   - common GND between the KC868-A6 and the TWC
#   - point-to-point bus: 120 ohm termination TWC side if needed.
# =============================================================================
substitutions:
  rs485_tx_pin: GPIO27
  rs485_rx_pin: GPIO14

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret loadpilot_wifi_ssid
  password: !secret loadpilot_wifi_password
  # The law must keep running with the network down (D2): never reboot on
  # WiFi loss — the UDP feed is gone anyway and the fail-safe arms itself.
  reboot_timeout: 0s
  ap:
    ssid: ${node_name}
    password: !secret loadpilot_ap_password

captive_portal:

uart:
  # Bus consumed by twc-core.yaml (modbus role: server). MAX13487E hardware
  # auto-direction -> NO flow_control_pin. 115200 8N1 (Neurio/Generac).
  - id: rs485
    tx_pin: ${rs485_tx_pin}
    rx_pin: ${rs485_rx_pin}
    baud_rate: 115200
    data_bits: 8
    parity: NONE
    stop_bits: 1
